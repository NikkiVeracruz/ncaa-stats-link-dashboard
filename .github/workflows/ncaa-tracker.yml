name: NCAA tracker update and publish
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: ncaa-tracker-production
  cancel-in-progress: false
jobs:
  update:
    # First activation requires Pages configured and NCAA_TRACKER_ENABLED=true.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.NCAA_TRACKER_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Pages configuration
        uses: actions/configure-pages@v5
      - name: Load durable prior feed
        run: |
          set -eu
          mkdir -p publish
          if git ls-remote --exit-code --heads origin ncaa-data >/dev/null; then
            git fetch origin refs/heads/ncaa-data:refs/remotes/origin/ncaa-data
            git worktree add --detach "$RUNNER_TEMP/ncaa-data" origin/ncaa-data
            test -s "$RUNNER_TEMP/ncaa-data/feed.json"
            cp "$RUNNER_TEMP/ncaa-data/feed.json" publish/feed.json
          else
            rc=$?
            test "$rc" = 2
            git worktree add --detach "$RUNNER_TEMP/ncaa-data" HEAD
          fi
      - name: Update games and optional reviewed links
        run: |
          set -eu
          python tracker.py --output publish/feed.json
          cp site/index.html site/app.js site/style.css publish/
          touch publish/.nojekyll
      - name: Persist forward-only feed before publication
        run: |
          set -eu
          cp publish/feed.json "$RUNNER_TEMP/ncaa-data/feed.json"
          cd "$RUNNER_TEMP/ncaa-data"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NCAA current games and forward-only archive"
            git push origin HEAD:refs/heads/ncaa-data
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish NCAA tracker
        id: deployment
        uses: actions/deploy-pages@v4

name: NCAA tracker update and publish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ncaa-tracker.yml'
      - 'paused/index.html'
permissions:
  contents: read
concurrency:
  group: ncaa-tracker-production
  cancel-in-progress: false
jobs:
  update:
    # Explicit user pause 2026-11-25: preserve the implementation, but never execute it.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Pages configuration
        uses: actions/configure-pages@v5
      - name: Load durable prior feed
        run: |
          set -eu
          mkdir -p publish
          if git ls-remote --exit-code --heads origin ncaa-data >/dev/null; then
            git fetch origin refs/heads/ncaa-data:refs/remotes/origin/ncaa-data
            git worktree add --detach "$RUNNER_TEMP/ncaa-data" origin/ncaa-data
            test -s "$RUNNER_TEMP/ncaa-data/feed.json"
            cp "$RUNNER_TEMP/ncaa-data/feed.json" publish/feed.json
          else
            rc=$?
            test "$rc" = 2
            git worktree add --detach "$RUNNER_TEMP/ncaa-data" HEAD
          fi
      - name: Update games and optional reviewed links
        run: |
          set -eu
          python tracker.py --output publish/feed.json
          cp site/index.html site/app.js site/style.css publish/
          touch publish/.nojekyll
      - name: Determine optional university PDF eligibility
        id: university_due
        run: python university_discovery.py --feed publish/feed.json --check-due >> "$GITHUB_OUTPUT"
      - name: Prepare PDF identity verification only for eligible pilot games
        if: steps.university_due.outputs.due == 'true'
        run: |
          if ! command -v pdftotext >/dev/null; then
            if ! (timeout 60s sudo apt-get update -qq && timeout 60s sudo apt-get install -y --no-install-recommends poppler-utils); then
              echo "::warning::Optional PDF verification tool unavailable; preserve normal game tracking"
            fi
          fi
      - name: Enrich verified optional university reports
        run: python university_discovery.py --feed publish/feed.json
      - name: Persist forward-only feed before publication
        run: |
          set -eu
          cp publish/feed.json "$RUNNER_TEMP/ncaa-data/feed.json"
          cd "$RUNNER_TEMP/ncaa-data"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NCAA current games and forward-only archive"
            git push origin HEAD:refs/heads/ncaa-data
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish
  paused_site:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Upload static pause notice only
        uses: actions/upload-pages-artifact@v3
        with:
          path: paused
  deploy:
    needs: paused_site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish NCAA tracker
        id: deployment
        uses: actions/deploy-pages@v4

name: Pre-merge NCAA proof-of-concept safety
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile read-only prototype
        run: python -m py_compile ncaa_poc.py reliability_probe.py tests/test_poc.py tests/test_reliability.py
      - name: Validate explicit university source registry
        run: python university_source_registry.py
      - name: Offline behavior and safety regression tests
        run: python -m unittest discover -s tests -v
      # Retrospective single-day source checks only; no games are archived.
      # Older dates must have real IDs. Most recent IDs can legitimately lag,
      # but any failed source/parse check remains a fatal error.
      - name: Read-only comparison (football Saturday, November 14)
        run: python ncaa_poc.py --date 2026-11-14 --require-matches --output diagnostics/football-earlier.json
      - name: Read-only comparison (basketball Thursday, November 12)
        run: python ncaa_poc.py --date 2026-11-12 --require-matches --output diagnostics/basketball-earlier.json
      - name: Read-only real-data trial (football Saturday, November 21)
        run: python ncaa_poc.py --date 2026-11-21 --output diagnostics/football-saturday.json
      - name: Read-only real-data trial (basketball Sunday, November 22)
        run: python ncaa_poc.py --date 2026-11-22 --output diagnostics/basketball-sunday.json
      - name: Bounded recent-date reliability baseline
        run: python reliability_probe.py --end 2026-11-23 --days 12 --output diagnostics/reliability.json
      - name: University directory and reviewed control comparison
        run: python university_probe.py
      - name: Replay reviewed university published-link observations
        run: python published_link_probe.py
      - name: Compile tracker and check browser script
        run: |
          python -m py_compile tracker.py link_enrichment.py university_discovery.py university_link_acquisition_probe.py
          node --check site/app.js
      - name: Build disposable current NCAA tracker preview
        run: |
          mkdir -p preview
          python tracker.py --archive-start "$(TZ=America/New_York date +%F)" --output preview/feed.json
          cp site/index.html site/app.js site/style.css preview/
      - name: Install PDF text verification tool for isolated trial
        if: github.head_ref == 'research/bounded-vanderbilt-report-discovery' || github.head_ref == 'feat/verified-wmt-school-pdf-expansion' || github.head_ref == 'feat/wmt-basketball-both-sports' || github.head_ref == 'research/wmt-24-school-batch'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v pdftotext
      - name: One bounded official schedule acquisition trial
        if: github.head_ref == 'research/bounded-vanderbilt-report-discovery' || github.head_ref == 'feat/verified-wmt-school-pdf-expansion' || github.head_ref == 'feat/wmt-basketball-both-sports' || github.head_ref == 'research/wmt-24-school-batch'
        run: python university_discovery.py --live-control
      - name: Verify two additional school PDFs in read-only feed
        if: github.head_ref == 'feat/verified-wmt-school-pdf-expansion' || github.head_ref == 'feat/wmt-basketball-both-sports' || github.head_ref == 'research/wmt-24-school-batch'
        run: python university_expansion_control.py
      - name: Verify new men's and women's basketball sources in read-only feed
        if: github.head_ref == 'feat/wmt-basketball-both-sports' || github.head_ref == 'research/wmt-24-school-batch'
        run: python basketball_expansion_control.py
      - name: Bounded read-only WMT candidate batch (24 schools, both basketball sports)
        if: github.head_ref == 'research/wmt-24-school-batch'
        run: python wmt_batch_probe.py
      - name: Save standalone preview
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-tracker-preview
          path: preview/
          retention-days: 7
      - name: Save diagnostic evidence even if data sources fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-contest-id-readonly-diagnostics
          path: diagnostics/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Safety invariant
        if: always()
        run: |
          test ! -d archive
          test ! -d docs
          test ! -e index.html
          test ! -e feed.json
          test ! -d publish
          echo 'PR checks do not deploy or persist production data'
